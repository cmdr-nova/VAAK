[package]
name = "vaak-worker"
version = "0.1.0"
edition = "2021"
description = "Shadow-mode Rust workers for VAAK (notif, ranked/newer, action-queue, jetstream hydrate)"
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "vaak-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "time", "net", "process"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
regex = "1"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
vaak-types = { path = "../vaak-types" }
# Nostr ingest (src/nostr): relay websockets over our own pinned TLS stream,
# and BIP-340 Schnorr checks on every stored event.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
k256 = { version = "0.14", default-features = false, features = ["schnorr", "std"] }
