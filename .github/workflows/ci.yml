# Basic CI for the PHP API and the Rust workspace.
#
# Jobs:
#   php             — php -l across api/, plus scripts that run with no services
#   rust            — cargo build, clippy, and cargo test (including vaak-types
#                     fixture_roundtrip). Many Rust tests shell out to
#                     api/bin/php-policy-test, so this job installs PHP too.
#   php-rust-parity — replay fixtures through both sides
#                     (`.github/scripts/php-rust-parity.py`, catalog in
#                     `parity/catalog.json`). Rust is the source of truth.
#                     Divergent output is reported (job summary + artifact) and
#                     does not fail the job. The job fails when the harness
#                     breaks or a Rust producer errors. No Postgres and no
#                     live worker. See parity/README.md to add a case.
#
#                     ActivityPub normalize fixtures under api/fixtures/normalize
#                     are not replayed here: normalize-fixture-smoke.php opens
#                     Postgres, and vaak-types only round-trips expected.json.
#
# Not in this workflow (no service, or already red on current main):
#   - Postgres. Migrations under api/migrations and ops/migrations are incremental
#     and are not a bootable schema. normalize-fixture-smoke.php defaults to
#     peer database "novalandia" through ap-db.php.
#   - Live worker client smokes (*-client-smoke.php, search-parity-smoke.php,
#     admin-safety-smoke.php, downrank-parity-smoke.php) require an explicit
#     loopback Rust URL and/or an isolated database URL.
#   - search-direct-undo-smoke.php's PostgreSQL INTEGER/BIGINT copy runs only
#     when LIBRARY_FIXTURE_SOCKET is set. CI runs the SQLite path.
#   - PHP scripts that fail on current main are omitted so this workflow stays
#     a signal for new breakage. They are listed in the pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP syntax and standalone tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, curl
          coverage: none
      - name: Syntax lint api/
        run: .github/scripts/php-lint.sh
      - name: Standalone tests
        run: .github/scripts/php-standalone-tests.sh

  rust:
    name: Rust build, clippy, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, curl
          coverage: none
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --workspace --locked --all-targets
      # Do not pass `-D warnings`. Current main already fails that bar
      # (hundreds of clippy and rustc warnings, mostly in vaak-worker).
      # Clippy still fails this job on hard errors.
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --locked --all-targets
      # actual_canonical_entity_helpers reads /tmp/vaak-profile-entity-helper-reference.json,
      # a machine-local oracle that is not in the repo and is not #[ignore].
      # Every other non-ignored test runs.
      - name: Test
        working-directory: rust
        run: cargo test --workspace --locked -- --skip profile_materialize::entities::tests::actual_canonical_entity_helpers

  php-rust-parity:
    name: PHP vs Rust parity
    needs: [php, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, curl
          coverage: none
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Replay fixtures and report divergences
        env:
          PARITY_REPORT_DIR: parity-report
          TZ: UTC
        run: python3 .github/scripts/php-rust-parity.py
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-rust-parity-report
          path: parity-report/
          if-no-files-found: warn
