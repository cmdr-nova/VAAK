# Basic CI for the PHP API and the Rust workspace.
#
# Jobs:
#   php             — php -l across api/, plus scripts that run with no services
#   rust            — cargo build, clippy, and cargo test (including vaak-types
#                     fixture_roundtrip). Many Rust tests shell out to
#                     api/bin/php-policy-test, so this job installs PHP too.
#   deploy-scripts  — version counter, release-commit gate, restart plan, and
#                     the production runner job guard
#   cargo-audit     — RustSec advisories against rust/Cargo.lock. Fails on
#                     vulnerabilities only; unmaintained and yanked warnings
#                     are printed and do not fail the job.
#   php-rust-parity — replay fixtures through both sides
#                     (`.github/scripts/php-rust-parity.py`, catalog in
#                     `parity/catalog.json`). Rust is the source of truth.
#                     Divergent output is reported (job summary + artifact) and
#                     does not fail the job. The job fails when the harness
#                     breaks or a Rust producer errors. No Postgres and no
#                     live worker. See parity/README.md to add a case.
#   php-db          — PHP smokes that need Postgres, Redis, or the Rust shadow
#                     worker (`.github/scripts/php-db-smokes.sh`). postgres:16
#                     and redis:7 service containers. The schema is staged
#                     from the migrated SQLite tables
#                     (`.github/scripts/pg-ci-schema.php`), then
#                     deploy/remote/migrate.php runs as it does on deploy.
#                     Covers normalize-fixture-smoke.php (the ActivityPub
#                     normalize fixtures), the *-client smokes against
#                     `vaak-worker serve`, admin-safety, downrank-parity,
#                     search-parity, direct-partial-blocks, and the
#                     PostgreSQL copy of search-direct-undo-smoke.php.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run on a branch before its pull request exists.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-scripts:
    name: Deploy script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version, release commit, and restart plan
        run: |
          set -euo pipefail
          python3 deploy/test_bump_version.py
          python3 deploy/test_require_green_ci.py
          python3 deploy/test_release_commit.py
          python3 deploy/test_restart_plan.py
          python3 deploy/test_jetstream_spool.py
          python3 deploy/test_ask_jsonld_guard.py
          python3 deploy/bump_version.py --check
          bash deploy/assemble-release.sh --self-test
          bash deploy/test_runner_job_guard.sh
          bash deploy/test_backup_restore_drill.sh

  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Without --deny, cargo audit exits non-zero only for vulnerabilities.
      - name: Audit
        working-directory: rust
        run: cargo audit

  php:
    name: PHP syntax and standalone tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, curl
          coverage: none
      - name: Syntax lint api/
        run: .github/scripts/php-lint.sh
      - name: Standalone tests
        run: .github/scripts/php-standalone-tests.sh

  rust:
    name: Rust build, clippy, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, curl
          coverage: none
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --workspace --locked --all-targets
      # Do not pass `-D warnings`. Current main already fails that bar
      # (hundreds of clippy and rustc warnings, mostly in vaak-worker).
      # Clippy still fails this job on hard errors.
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --locked --all-targets
      # actual_canonical_entity_helpers reads /tmp/vaak-profile-entity-helper-reference.json,
      # a machine-local oracle that is not in the repo and is not #[ignore].
      # Every other non-ignored test runs.
      - name: Test
        working-directory: rust
        run: cargo test --workspace --locked -- --skip profile_materialize::entities::tests::actual_canonical_entity_helpers

  php-rust-parity:
    name: PHP vs Rust parity
    needs: [php, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, curl
          coverage: none
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Replay fixtures and report divergences
        env:
          PARITY_REPORT_DIR: parity-report
          TZ: UTC
        run: python3 .github/scripts/php-rust-parity.py
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-rust-parity-report
          path: parity-report/
          if-no-files-found: warn

  php-db:
    name: PHP database smokes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # The socket directory is shared with the runner for the smokes that
        # connect over a Unix socket under /tmp/.
        volumes:
          - /tmp/vaak-pg-socket:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, curl, pdo_pgsql, pgsql, redis
          coverage: none
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build vaak-worker
        working-directory: rust
        run: cargo build -p vaak-worker --locked
      - name: Database smokes
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          LIBRARY_FIXTURE_SOCKET: /tmp/vaak-pg-socket
          VAAK_REDIS_DSN: redis://127.0.0.1:6379/0
          VAAK_WORKER_BIN: ${{ github.workspace }}/rust/target/debug/vaak-worker
        run: .github/scripts/php-db-smokes.sh
