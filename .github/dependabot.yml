# Weekly dependency updates. Minor and patch bumps land as one grouped pull
# request per ecosystem; major bumps open on their own. CI runs on
# GitHub-hosted runners with a read-only token for these pull requests.
# Deploys stay manual (deploy-production.yml is workflow_dispatch only).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # deploy/ap-bsky-jetstream-requirements.txt and
  # deploy/ap-ask-jsonld-requirements.txt
  - package-ecosystem: pip
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
