<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading profile… · VAAK</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #000; color: #aaa; font: 0.9rem/1.4 system-ui, sans-serif; }
    main { display: grid; justify-items: center; gap: .8rem; text-align: center; }
    img { width: min(240px, 58vw); max-height: 62vh; object-fit: contain; }
    p { margin: 0; }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <img src="https://mkultra.monster/api/assets/vaak-mascot-loading.gif" alt="">
    <p>Loading profile…</p>
  </main>
  <script>
    (function () {
      var raw = new URLSearchParams(location.search).get('target') || '';
      try {
        var target = new URL(raw, location.origin);
        var hostOk = target.hostname === 'mkultra.monster' || target.hostname === 'vaak.monster';
        var pathOk = /^\/(?:users\/[A-Za-z][A-Za-z0-9_]{1,29}(?:\/|$)|@[A-Za-z][A-Za-z0-9_]{1,29}(?:\/|$))/i.test(target.pathname);
        if (!hostOk || !pathOk) throw new Error('invalid target');
        window.setTimeout(function () { location.replace(target.href); }, 120);
      } catch (_) {
        document.querySelector('p').textContent = 'Profile link unavailable.';
      }
    }());
  </script>
</body>
</html>
